<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Калории</title>
<style>
/* ===== Базовые переменные и сброс ===== */
:root{--bg:#111214;--card:#1b1d21;--line:#2a2d33;--txt:#e8e9eb;--dim:#8b9098;--acc:#7fd6a0;--bad:#e5766f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,sans-serif}
body{padding:16px 16px calc(88px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;min-height:100vh}
h1{font-size:22px;margin:8px 0 16px;font-weight:600}
h2{font-size:15px;margin:20px 0 8px;color:var(--dim);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.dim{color:var(--dim);font-size:13px}

/* ===== Кнопки и поля (мин. высота 48px) ===== */
button,input,select,textarea{font:inherit;color:var(--txt)}
.btn{display:block;width:100%;min-height:56px;padding:12px 16px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:left;font-size:17px;cursor:pointer}
.btn.main{background:var(--acc);color:#0b1a10;border-color:var(--acc);font-weight:600;text-align:center}
.btn.danger{color:var(--bad)}
.btn:active{opacity:.7}
label{display:block;margin:12px 0 4px;color:var(--dim);font-size:13px}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;background:#15171a;border:1px solid var(--line);border-radius:10px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}

/* ===== Прогресс ===== */
.big{font-size:30px;font-weight:600}
.bar{height:10px;background:#2a2d33;border-radius:6px;overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.bar.over>i{background:var(--bad)}

/* ===== Дневник ===== */
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .info{flex:1;min-width:0}
.item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{min-width:48px;min-height:48px;background:none;border:1px solid var(--line);border-radius:10px;color:var(--bad);cursor:pointer}

/* ===== Нижняя навигация ===== */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:60px;background:none;border:0;color:var(--dim);font-size:14px;cursor:pointer}
nav button.on{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}

/* ===== Нижняя шторка, сканер, загрузка, тосты ===== */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border:1px solid var(--line)}
.scan{background:#000;align-items:center;flex-direction:column;justify-content:center;gap:12px;z-index:30}
.scan video,#reader{width:100%;max-width:560px;max-height:70vh;background:#000}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:r 1s linear infinite;margin:0 auto 12px}
@keyframes r{to{transform:rotate(360deg)}}
#toasts{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#2a2d33;border-left:4px solid var(--acc);padding:12px 14px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.toast.err{border-color:var(--bad)}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden>
  <button data-v="home">Главная</button>
  <button data-v="diary">Дневник</button>
  <button data-v="settings">Настройки</button>
</nav>
<div id="toasts"></div>
<input type="file" id="photo" accept="image/*" capture="environment" hidden>

<script>
(function () {
'use strict';

/* ===== Утилиты ===== */
const $ = s => document.querySelector(s);
const p2 = n => String(n).padStart(2, '0');
const r1 = n => Math.round(n * 10) / 10;
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n >= 0 ? n : 0; };
// Безопасное создание элементов (без innerHTML для пользовательских данных)
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  });
  kids.flat().forEach(c => e.append(c instanceof Node ? c : document.createTextNode(c == null ? '' : c)));
  return e;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('Не удалось сохранить данные', 1); return false; } }
};
const dayKey = (d = new Date()) => 'log_' + d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());

/* ===== Тосты ===== */
function toast(msg, err) {
  const t = h('div', { class: 'toast' + (err ? ' err' : '') }, msg);
  $('#toasts').append(t);
  setTimeout(() => t.remove(), 3500);
}

/* ===== PWA: manifest через data URI ===== */
(function () {
  const icon = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#111214"/><circle cx="256" cy="256" r="150" fill="none" stroke="#7fd6a0" stroke-width="40"/></svg>');
  const m = { name: 'Калории', short_name: 'Калории', start_url: location.href, display: 'standalone', background_color: '#111214', theme_color: '#111214', icons: [{ src: icon, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }] };
  const l = document.createElement('link');
  l.rel = 'manifest';
  l.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(m));
  document.head.append(l);
})();

/* ===== Расчёт нормы (Миффлин-Сан Жеор) ===== */
const ACT = { sed: ['Сидячий', 1.2], light: ['Лёгкий', 1.375], mid: ['Средний', 1.55], high: ['Высокий', 1.725] };
const GOAL = { lose: ['Похудение', 0.8], keep: ['Поддержание', 1], gain: ['Набор', 1.15] };
function calcNorm(p) {
  const bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === 'm' ? 5 : -161);
  const tdee = bmr * ACT[p.act][1];
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), norm: Math.round(tdee * GOAL[p.goal][1]) };
}

/* ===== Состояние ===== */
let view = 'home';
const profile = () => store.get('profile', null);
const getLog = () => store.get(dayKey(), []);

/* ===== Отрисовка ===== */
function render() {
  const app = $('#app'); app.innerHTML = '';
  const p = profile();
  $('#nav').hidden = !p;
  if (!p || view === 'profile') { app.append(profileForm(p)); return; }
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  app.append(view === 'diary' ? diaryView() : view === 'settings' ? settingsView() : homeView(p));
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => { view = b.dataset.v; render(); }));

/* ----- Профиль ----- */
function profileForm(p) {
  p = p || { sex: 'm', age: '', height: '', weight: '', act: 'light', goal: 'keep' };
  const sel = (id, opts, val) => h('select', { id }, Object.entries(opts).map(([k, v]) => { const o = h('option', { value: k }, Array.isArray(v) ? v[0] : v); if (k === val) o.selected = true; return o; }));
  const inp = (id, val) => h('input', { id, type: 'number', inputmode: 'decimal', value: val });
  const box = h('div', {},
    h('h1', {}, profile() ? 'Профиль' : 'Добро пожаловать'),
    h('div', { class: 'card' },
      h('label', {}, 'Пол'), sel('f-sex', { m: 'Мужской', f: 'Женский' }, p.sex),
      h('div', { class: 'row' },
        h('div', {}, h('label', {}, 'Возраст'), inp('f-age', p.age)),
        h('div', {}, h('label', {}, 'Рост, см'), inp('f-h', p.height)),
        h('div', {}, h('label', {}, 'Вес, кг'), inp('f-w', p.weight))),
      h('label', {}, 'Уровень активности'), sel('f-act', ACT, p.act),
      h('label', {}, 'Цель'), sel('f-goal', GOAL, p.goal)),
    h('button', { class: 'btn main', onclick: () => {
      const n = { sex: $('#f-sex').value, age: num($('#f-age').value), height: num($('#f-h').value), weight: num($('#f-w').value), act: $('#f-act').value, goal: $('#f-goal').value };
      if (n.age < 10 || n.age > 100 || n.height < 100 || n.height > 250 || n.weight < 30 || n.weight > 300) { toast('Проверьте возраст, рост и вес', 1); return; }
      n.norm = calcNorm(n).norm;
      store.set('profile', n); view = 'home'; render();
      toast('Дневная норма: ' + n.norm + ' ккал');
    } }, 'Сохранить'));
  if (profile()) box.append(h('button', { class: 'btn', onclick: () => { view = 'settings'; render(); } }, 'Отмена'));
  return box;
}

/* ----- Главная ----- */
function sums(log) { return log.reduce((a, e) => ({ k: a.k + e.k, p: a.p + e.p, f: a.f + e.f, c: a.c + e.c }), { k: 0, p: 0, f: 0, c: 0 }); }
function homeView(p) {
  const s = sums(getLog()), norm = p.norm;
  const pct = Math.min(100, s.k / norm * 100);
  return h('div', {},
    h('h1', {}, 'Сегодня'),
    h('div', { class: 'card' },
      h('div', { class: 'big' }, Math.round(s.k) + ' / ' + norm + ' ккал'),
      h('div', { class: 'bar' + (s.k > norm ? ' over' : '') }, h('i', { style: 'width:' + pct + '%' })),
      h('div', { class: 'dim' }, 'Б ' + r1(s.p) + ' г  ·  Ж ' + r1(s.f) + ' г  ·  У ' + r1(s.c) + ' г'),
      h('div', { class: 'dim' }, s.k > norm ? 'Превышение: ' + Math.round(s.k - norm) + ' ккал' : 'Осталось: ' + Math.round(norm - s.k) + ' ккал')),
    h('button', { class: 'btn main', onclick: startScan }, 'Сканировать штрихкод'),
    h('button', { class: 'btn main', onclick: () => $('#photo').click() }, 'Сфоткать блюдо'),
    h('button', { class: 'btn main', onclick: textSheet }, 'Описать словами'),
    h('button', { class: 'btn', onclick: () => openSheet({ name: '', grams: 100, per100: { k: 0, p: 0, f: 0, c: 0 } }) }, 'Ввести вручную'));
}

/* ----- Дневник ----- */
function diaryView() {
  const log = getLog(), box = h('div', {}, h('h1', {}, 'Дневник'));
  const card = h('div', { class: 'card' });
  if (!log.length) card.append(h('div', { class: 'dim' }, 'Сегодня записей нет'));
  log.forEach(e => card.append(h('div', { class: 'item' },
    h('div', { class: 'info' },
      h('div', { class: 'nm' }, e.name),
      h('div', { class: 'dim' }, e.t + ' · ' + e.g + ' г · ' + Math.round(e.k) + ' ккал'),
      h('div', { class: 'dim' }, 'Б ' + r1(e.p) + ' · Ж ' + r1(e.f) + ' · У ' + r1(e.c))),
    h('button', { class: 'del', 'aria-label': 'Удалить', onclick: () => { store.set(dayKey(), getLog().filter(x => x.id !== e.id)); render(); } }, 'Удалить'))));
  box.append(card, h('button', { class: 'btn', onclick: exportAll }, 'Экспорт в JSON'));
  return box;
}
function exportAll() {
  const out = { profile: profile(), logs: {} };
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('log_')) out.logs[k] = store.get(k, []); }
  const a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' })), download: 'calories-' + dayKey().slice(4) + '.json' });
  document.body.append(a); a.click(); a.remove();
  toast('Экспорт готов');
}

/* ----- Настройки ----- */
let resetArmed = false;
function settingsView() {
  const key = h('input', { id: 'key', type: 'password', placeholder: 'Gemini API-ключ', value: store.get('gemini_key', ''), autocomplete: 'off' });
  return h('div', {},
    h('h1', {}, 'Настройки'),
    h('div', { class: 'card' }, h('label', {}, 'Gemini API-ключ'), key,
      h('button', { class: 'btn main', style: 'margin-top:12px;margin-bottom:0', onclick: () => { store.set('gemini_key', key.value.trim()); toast('Ключ сохранён'); } }, 'Сохранить ключ')),
    h('button', { class: 'btn', onclick: () => { view = 'profile'; render(); } }, 'Изменить профиль'),
    h('button', { class: 'btn', onclick: exportAll }, 'Экспорт в JSON'),
    h('button', { class: 'btn danger', onclick: () => {
      // Двойное нажатие вместо confirm()
      if (!resetArmed) { resetArmed = true; toast('Нажмите ещё раз для сброса всех данных', 1); setTimeout(() => resetArmed = false, 4000); return; }
      try { localStorage.clear(); } catch (e) {}
      resetArmed = false; view = 'home'; render(); toast('Данные удалены');
    } }, 'Сбросить все данные'));
}

/* ===== Шторка добавления записи ===== */
let sheetEl = null;
function closeSheet() { if (sheetEl) { sheetEl.remove(); sheetEl = null; } }
function showSheet(...kids) {
  closeSheet();
  sheetEl = h('div', { class: 'ovl', onclick: e => { if (e.target === sheetEl) closeSheet(); } }, h('div', { class: 'sheet' }, kids));
  document.body.append(sheetEl);
}
// draft: {name, grams, per100:{k,p,f,c}, note}
function openSheet(d) {
  const f = (id, label, val) => h('div', {}, h('label', {}, label), h('input', { id, type: 'number', inputmode: 'decimal', value: val, oninput: upd }));
  const total = h('div', { class: 'card big', style: 'font-size:18px' });
  function upd() {
    const g = num($('#s-g').value), k = g / 100;
    total.textContent = Math.round(num($('#s-k').value) * k) + ' ккал · Б ' + r1(num($('#s-p').value) * k) + ' · Ж ' + r1(num($('#s-f').value) * k) + ' · У ' + r1(num($('#s-c').value) * k);
  }
  showSheet(
    h('h1', {}, 'Новая запись'),
    d.note ? h('div', { class: 'dim' }, d.note) : '',
    h('label', {}, 'Название'), h('input', { id: 's-n', value: d.name }),
    f('s-g', 'Граммов съедено', d.grams),
    h('h2', {}, 'КБЖУ на 100 г'),
    h('div', { class: 'row' }, f('s-k', 'Ккал', r1(d.per100.k)), f('s-p', 'Белки', r1(d.per100.p))),
    h('div', { class: 'row' }, f('s-f', 'Жиры', r1(d.per100.f)), f('s-c', 'Углев.', r1(d.per100.c))),
    h('h2', {}, 'Итого'), total,
    h('button', { class: 'btn main', onclick: () => {
      const g = num($('#s-g').value), k = g / 100, name = $('#s-n').value.trim();
      if (!name || g <= 0) { toast('Укажите название и граммы', 1); return; }
      const t = new Date(), log = getLog();
      log.push({ id: Date.now(), name, g: r1(g), k: num($('#s-k').value) * k, p: num($('#s-p').value) * k, f: num($('#s-f').value) * k, c: num($('#s-c').value) * k, t: p2(t.getHours()) + ':' + p2(t.getMinutes()) });
      if (store.set(dayKey(), log)) { closeSheet(); view = 'home'; render(); toast('Добавлено'); }
    } }, 'Добавить в дневник'),
    h('button', { class: 'btn', onclick: closeSheet }, 'Отмена'));
  upd();
}
function busy(msg) { showSheet(h('div', { style: 'text-align:center;padding:24px 0' }, h('div', { class: 'spin' }), msg)); }

/* ===== Штрихкод ===== */
let stream = null, qr = null, scanOn = false, scanEl = null;
function stopScan() {
  scanOn = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (qr) { const q = qr; qr = null; q.stop().then(() => q.clear()).catch(() => {}); }
  if (scanEl) { scanEl.remove(); scanEl = null; }
}
async function startScan() {
  scanOn = true;
  const video = h('video', { playsinline: '', muted: '' });
  scanEl = h('div', { class: 'ovl scan' }, video, h('div', { id: 'reader', hidden: '' }),
    h('div', { class: 'dim' }, 'Наведите камеру на штрихкод'),
    h('button', { class: 'btn', style: 'max-width:320px;text-align:center', onclick: stopScan }, 'Закрыть'));
  document.body.append(scanEl);
  // Сначала встроенный BarcodeDetector, иначе html5-qrcode
  if ('BarcodeDetector' in window) {
    try {
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream; await video.play();
      const loop = async () => {
        if (!scanOn) return;
        try { const r = await det.detect(video); if (r.length && scanOn) { onCode(r[0].rawValue); return; } } catch (e) {}
        setTimeout(loop, 200);
      };
      loop(); return;
    } catch (e) { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
  }
  fallbackScan(video);
}
function fallbackScan(video) {
  video.hidden = true; $('#reader').hidden = false;
  const run = () => {
    if (!scanOn) return;
    qr = new Html5Qrcode('reader');
    qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 160 } }, code => onCode(code), () => {})
      .catch(() => { stopScan(); toast('Нет доступа к камере', 1); });
  };
  if (window.Html5Qrcode) { run(); return; }
  const s = document.createElement('script');
  s.src = 'https://unpkg.com/html5-qrcode';
  s.onload = run;
  s.onerror = () => { stopScan(); toast('Не удалось загрузить сканер. Введите КБЖУ вручную', 1); };
  document.head.append(s);
}
async function onCode(code) {
  if (!scanOn) return;
  stopScan(); busy('Поиск продукта...');
  try {
    const r = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json');
    if (!r.ok) throw new Error('http');
    const j = await r.json();
    if (j.status !== 1 || !j.product) throw new Error('nf');
    const n = j.product.nutriments || {};
    let k = n['energy-kcal_100g'];
    if (k == null && n['energy_100g'] != null) k = n['energy_100g'] / 4.184;
    openSheet({ name: j.product.product_name || 'Продукт ' + code, grams: 100, per100: { k: num(k), p: num(n.proteins_100g), f: num(n.fat_100g), c: num(n.carbohydrates_100g) }, note: k == null ? 'В базе нет калорийности, проверьте значения' : '' });
  } catch (e) {
    closeSheet();
    toast(e.message === 'nf' ? 'Продукт не найден. Введите КБЖУ вручную' : 'Ошибка сети. Введите КБЖУ вручную', 1);
    openSheet({ name: '', grams: 100, per100: { k: 0, p: 0, f: 0, c: 0 }, note: 'Штрихкод: ' + code });
  }
}

/* ===== Gemini (через шлюз ProxyAPI) ===== */
// Требуемый формат ответа: только название и КБЖУ на 100 г, вес вводит пользователь
const PROMPT_TAIL = 'Верни СТРОГО JSON без markdown: {"dish_name": "название блюда", "calories_per_100g": число, "protein_per_100g": число, "fat_per_100g": число, "carbs_per_100g": число, "confidence": "high/medium/low"}';
// ...
  // Проверяем, если ключ начинается на AIza — это Google. Если на sk- — это ProxyAPI.
  const isGoogle = key.startsWith('AIza');
  
  // Для ProxyAPI используем новый адрес без /google
  const url = isGoogle 
    ? 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(key)
    : 'https://api.proxyapi.ru/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(key);
// ...
function aiFail(e, name) {
  closeSheet(); toast(e.message + '. Введите КБЖУ вручную', 1);
  openSheet({ name: name || '', grams: 100, per100: { k: 0, p: 0, f: 0, c: 0 } });
}

/* ----- Фото блюда ----- */
// Уменьшаем фото перед отправкой, чтобы запрос был лёгким
function shrink(file) {
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, 1024 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => no(new Error('Не удалось прочитать фото'));
    img.src = url;
  });
}
$('#photo').addEventListener('change', async ev => {
  const file = ev.target.files[0]; ev.target.value = '';
  if (!file) return;
  busy('Анализ фото...');
  try {
    const b64 = await shrink(file);
    openSheet(await gemini([{ inline_data: { mime_type: 'image/jpeg', data: b64 } }, { text: 'Определи блюдо на фото и дай его КБЖУ на 100 грамм. ' + PROMPT_TAIL }]));
  } catch (e) { aiFail(e); }
});

/* ----- Описание словами ----- */
function textSheet() {
  const ta = h('textarea', { placeholder: 'Например: две сосиски с гречкой и огурец' });
  showSheet(h('h1', {}, 'Описать словами'), ta,
    h('button', { class: 'btn main', style: 'margin-top:12px', onclick: async () => {
      const t = ta.value.trim();
      if (!t) { toast('Опишите, что вы съели', 1); return; }
      busy('Оценка...');
      try { openSheet(await gemini([{ text: 'Определи блюдо по описанию: ' + t + '. Дай его КБЖУ на 100 грамм. ' + PROMPT_TAIL }])); }
      catch (e) { aiFail(e, t.slice(0, 60)); }
    } }, 'Оценить'),
    h('button', { class: 'btn', onclick: closeSheet }, 'Отмена'));
  ta.focus();
}

render();
})();
</script>
</body>
